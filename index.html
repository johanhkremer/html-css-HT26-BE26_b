<!DOCTYPE html>
<html lang="sv">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css" />
    <title>Cafè - Hem</title>
</head>

<!-- * Så här skriver man en kommentar i HTML – den syns inte på sidan -->

<body>
    <header>
        <nav class="navbar">
            <ul>
                <li>
                    <a href="index.html">Hem</a>
                </li>
                <li>
                    <a href="menu.html">Meny</a>
                </li>
                <li>
                    <a href="about.html">Om oss</a>
                </li>
                <li>
                    <a href="boxes.html">Lådor</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Välkomment till vårt cafè</h1>
            <p>Hantverkskaffe mitt Malmö</p>
            <!-- ! Inline-style (style="...") har högst specificitet och är svår att återanvända – lägg hellre stilen i CSS-filen -->
            <img style="width: 200px; border-radius: 10px;" src="assets/images.jpeg" alt="">
        </section>

        <!-- ? Bakgrundsbilden sätts i CSS (.background-img), inte med <img> – varför kan det vara smart här? -->
        <div class="background-img">
            <h2>Öppettider</h2>
        </div>

        <section>
            <table>
                <tbody>
                    <tr>
                        <th class="red">Dag</th>
                        <th class="red">Tid</th>
                    </tr>
                    <tr>
                        <td>Mån-fre</td>
                        <td>09.00-16.00</td>
                    </tr>
                    <tr>
                        <td>Lör</td>
                        <td>10.00-15.00</td>
                    </tr>
                    <tr>
                        <td>Sön</td>
                        <td>Stängt</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>café 2026</p>
    </footer>
</body>

</html>
